# Default settings for `beemon process`.
# Do not edit this file: edit configs/pipeline.yaml instead (values there override these).
# Any value can also be overridden on the command line:  --set tracker.max_lost_s=1.5

detector:
  weights: models/detector.pt   # trained YOLO detector (.pt)
  input: rgb            # rgb | mie  -> MUST match how the model was trained (see README, "Motion-informed frames")
  imgsz: 1280           # inference size; use the size the model was trained with
  conf: 0.10            # keep LOW: the tracker re-uses weak detections to continue existing tracks
  iou: 0.5              # NMS IoU
  device: null          # null = automatic (GPU if available), "cpu", or "0" for GPU 0
  classes: null         # optional list of class ids to keep, e.g. [0, 1]
  max_det: 300
  augment: false        # test-time augmentation (flips/scales): ~3x slower, better recall — used for auto-labelling
  tiles:                # sliced inference (SAHI-style) for very small bees
    enabled: false
    size: 960           # tile size in pixels (use the tile size the model was trained on)
    overlap: 0.2
    include_full_frame: true

motion:
  enabled: true         # frame differencing: needed for input: mie and for the motion filters
  offset_frames: 4      # motion is computed from frames k-n, k, k+n  (n = offset_frames)
  blur: 5               # Gaussian blur kernel before differencing (odd number)
  local_kernel: 0       # experimental: >0 subtracts the surrounding motion (px window, e.g. 101) to suppress
                        # wind-swayed flower clusters; must match --mie-local-kernel of an mie dataset

video:
  start_s: 0
  end_s: null           # null = until the end
  frame_stride: 2       # process every Nth frame (2 -> 15 fps for 30 fps video)
  idle_stride: 3        # while no bee is tracked, run the detector only every Nth processed frame (speed-up)
  adapt_to_stride: true # frame_stride > 3: tracker/filter rules are adapted so short visits still count

tracker:
  type: beetrack        # beetrack (ours, distance-based ByteTrack logic) | bytetrack (Ultralytics, IoU-based baseline)
  high_conf: 0.35       # stage 1: detections at or above this are matched first
  low_conf: 0.10        # stage 2: weaker detections may only CONTINUE an existing track
  new_track_conf: 0.40  # a new track needs at least this confidence
  min_hits: 3           # detections needed before a track is confirmed
  max_speed_px_s: 1200  # how far (px) a bee may move per second -> matching gate
  min_gate_px: 25       # smallest matching radius (px)
  max_gate_px: 250      # largest matching radius (px)
  max_lost_s: 1.0       # keep a lost track this long before ending it
  tentative_max_lost_s: 0.3
  size_ratio_max: 3.0   # reject matches whose box size differs more than this factor
  edge_margin_px: 15    # a track predicted to leave the frame through this margin is ended at once

filters:                # decide which tracks count as real bee visits (see README, "Tracking")
  min_duration_s: 0.4   # shorter tracks = flicker / false positives
  min_detections: 4
  static_min_s: 3.0     # "same place for too long" rule ... (3 s: tuned on RIMG0006, flower centres)
  static_radius_factor: 1.0  #   ... staying within (factor x box size) of its mean position
  static_motion_max: 1.3     #   ... AND barely moving itself (box motion / surrounding motion)
  hotspot_grid: [32, 18]     # grid for background hotspots (cells across, cells down)
  hotspot_fraction: 0.4      # a cell with detections in >40% of processed frames is a background hotspot
  hotspot_min_video_s: 20    # only use hotspots for videos at least this long
  hotspot_track_fraction: 0.5
  min_mean_conf: 0.0

classifier:             # optional 2nd stage: classify crops of each track and vote
  weights: null         # YOLO classification model (.pt), e.g. trained with `beemon train --preset classify`
  imgsz: 128
  pad: 0.25             # crop padding around the box (fraction of box size)
  max_crops_per_track: 12
  reject_class: not_insect

output:
  save_video: true      # annotated MP4 (second pass)
  video_scale: 0.5      # output video size relative to the input
  trail_s: 1.5          # length of the drawn trajectory tail
  draw_rejected: true   # also draw rejected tracks (grey)
  save_thumbnails: true # best crop of every track (for the dashboard gallery)
  live_preview: true    # results/<video>/live.jpg while processing (shown live in the dashboard)
  live_every_s: 1.0     # redraw the live picture at most this often
  heatmap_grid: [64, 36]
  activity_bin_s: 5.0
